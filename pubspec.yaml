name: work_hours_app
description: Offline work shift planning and time tracking for Android and Windows.
publish_to: none
version: 0.2.0-beta.2+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7+1
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.0
  timezone: ^0.11.2
  file_picker: ^13.1.0
  shared_preferences: ^2.5.5
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
