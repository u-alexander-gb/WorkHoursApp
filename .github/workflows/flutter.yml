name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source for checks
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test dialog cancellation
        run: flutter test test/backup_password_dialog_test.dart --reporter expanded --timeout 45s
        timeout-minutes: 1
      - name: Test
        run: flutter test --reporter expanded --timeout 45s
        timeout-minutes: 5
      - name: Configure release signing
        if: github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/workhours-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=workhours\nstoreFile=../workhours-release.jks\n' \
            "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties
      - name: Build signed release APK
        if: github.event_name == 'push'
        run: flutter build apk --release
      - name: Save release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: work-hours-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - name: Save Windows app
        uses: actions/upload-artifact@v4
        with:
          name: work-hours-windows
          path: build/windows/x64/runner/Release/
