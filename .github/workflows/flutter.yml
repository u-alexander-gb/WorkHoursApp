name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source for checks
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test dialog cancellation
        run: flutter test test/backup_password_dialog_test.dart --reporter expanded --timeout 45s
        timeout-minutes: 3
      - name: Test
        run: flutter test --reporter expanded --timeout 45s
        timeout-minutes: 5
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: work-hours-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - name: Save Windows app
        uses: actions/upload-artifact@v4
        with:
          name: work-hours-windows
          path: build/windows/x64/runner/Release/
